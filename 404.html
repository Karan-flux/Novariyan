<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 — Page Not Found | Novariyan</title>

    <meta
        name="description"
        content="The page you're looking for could not be found."
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/images/favicon.png"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .error-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050505;
            color: #ffffff;

            text-align: center;

            padding: 40px 20px;
        }

        .error-content {
            max-width: 650px;
        }

        .error-number {
            margin-bottom: 15px;

            color: #ff1025;

            font-size: clamp(90px, 18vw, 180px);

            font-weight: 800;

            line-height: 0.9;

            letter-spacing: -8px;
        }

        .error-content h1 {
            margin-bottom: 20px;

            font-size: clamp(32px, 5vw, 56px);

            letter-spacing: -2px;
        }

        .error-content p {
            margin: 0 auto 35px;

            max-width: 500px;

            color: #888888;

            font-size: 16px;

            line-height: 1.7;
        }

        .error-content .button {
            display: inline-block;
        }

    </style>

</head>


<body>

    <main class="error-page">

        <div class="error-content">

            <div class="error-number">
                404
            </div>

            <h1>
                Page not found.
            </h1>

            <p>
                Looks like this page took a wrong turn.
                Let's get you back to Novariyan.
            </p>

            <a
                href="index.html"
                class="button button-primary"
            >
                ← Back to Novariyan
            </a>

        </div>

    </main>

</body>

</html>
